services:
  spotdl:
    container_name: spotdl
    build: .
    image: spotdl-dev:latest
    command: web --host 0.0.0.0 --web-use-output-dir
    environment:
      # - PUID=1000
      # - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      # - UMASK=002
      # Contraseña para acceder a la web (opcional). Ej: SPOTDL_WEB_PASSWORD=tu_contraseña
      - SPOTDL_WEB_PASSWORD=${SPOTDL_WEB_PASSWORD}
    ports:
      - 8800:8800
    volumes:
      - ./music:/music
    restart: unless-stopped
